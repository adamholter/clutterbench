<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "ABC Diatype"; src: url("assets/ABCDiatype-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "ABC Diatype"; src: url("assets/ABCDiatype-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Martina Plantijn"; src: url("assets/MartinaPlantijn-Regular.woff2") format("woff2"); }

  html, body { margin: 0; padding: 0; width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #f8f8f3;
    color: #000;
    font-family: "ABC Diatype", sans-serif;
    position: relative;
  }
  .logo {
    position: absolute;
    left: 72px;
    top: 72px;
    width: 180px;
  }
  .figure {
    position: absolute;
    left: 0;
    right: 0;
    top: 300px;
    text-align: center;
  }
  .stat {
    font-family: "Martina Plantijn", serif;
    font-size: 560px;
    line-height: 1;
    color: #026340;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .label {
    margin: 32px auto 0;
    font-size: 34px;
    font-weight: 400;
    color: #393939;
    max-width: 760px;
    line-height: 1.3;
  }
</style>
</head>
<body>
  <img class="logo" src="assets/afterquery-logo.svg" alt="AfterQuery">
  <div class="figure">
    <p class="stat">+5%</p>
    <p class="label">Output quality in one month from harness changes informed by BAR</p>
  </div>
</body>
</html>
