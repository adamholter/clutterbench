<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:D;font-weight:400;src:url(assets/ABCDiatype_Regular.woff2)}
@font-face{font-family:D;font-weight:500;src:url(assets/ABCDiatype_Medium.woff2)}

*{margin:0;box-sizing:border-box}
body{width:1200px;height:1200px;background:#0c0c0c;color:#f6f5ee;font-family:D,sans-serif;position:relative;overflow:hidden;padding:80px}

h1{font-family:M,serif;font-weight:400;font-size:76px;line-height:1.05;margin-top:70px;letter-spacing:-1px}

svg{position:absolute;left:0;top:480px}
.stats{position:absolute;left:80px;right:80px;bottom:80px;display:flex;border-top:1px solid #333;padding-top:28px}
.stats div{flex:1}.stats b{font-family:M;font-weight:400;font-size:54px;display:block}
.stats span{font-size:19px;color:#a8a7a1}

<div class="top"><img src="assets/mark.svg"><span>Research · Oct 8, 2026</span></div>

<rect x="80" y="40" width="440" height="280" rx="4" fill="#2a2a28"/>
